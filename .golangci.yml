version: "2"
run:
  skip-dirs:
    - web
    - web/node_modules
  skip-dirs-use-default: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - depguard
  settings:
    depguard:
      rules:
        engine:
          files:
            - "**/pkg/engine/**"
          deny:
            - pkg: "github.com/gargi-indic/gargi-flow/internal"
              desc: "pkg/engine must not import internal packages"
        graph_and_reactive:
          files:
            - "**/internal/graph/**"
            - "**/internal/reactive/**"
          deny:
            - pkg: "github.com/gargi-indic/gargi-flow/internal/api"
              desc: "domain packages must not import internal/api"
            - pkg: "github.com/gargi-indic/gargi-flow/internal/orchestrator"
              desc: "domain packages must not import internal/orchestrator"
            - pkg: "github.com/gargi-indic/gargi-flow/internal/store"
              desc: "domain packages must not import internal/store"
        simulation:
          files:
            - "**/pkg/sim/**"
            - "**/internal/sim/**"
          deny:
            - pkg: "github.com/gargi-indic/gargi-flow/internal/api"
              desc: "simulation packages must not import internal/api"
            - pkg: "github.com/gargi-indic/gargi-flow/internal/orchestrator"
              desc: "simulation packages must not import internal/orchestrator"
            - pkg: "github.com/gargi-indic/gargi-flow/internal/store"
              desc: "simulation packages must not import internal/store"
            - pkg: "go.temporal.io"
              desc: "simulation packages must not import Temporal"
        sim_contracts:
          files:
            - "**/pkg/sim/**"
          deny:
            - pkg: "github.com/gargi-indic/gargi-flow/internal"
              desc: "pkg/sim must not import internal packages"
issues:
  exclude-rules:
    - path: "web/.*"
      linters:
        - revive
        - errcheck
        - govet
        - staticcheck
        - depguard
formatters:
  enable:
    - gofumpt
