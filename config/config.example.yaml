store:
  # Allowed values for driver: memory, redis, postgres, neo4j
  driver: memory
  # Optional capability-based composition (combining adapters, e.g. redis for state + postgres for audit log):
  # capabilities:
  #   state: redis
  #   lock: redis
  #   events: redis
  #   execution_log: postgres
  #   # Simulation models, policies, experiments and reports: memory or
  #   # postgres (default: postgres when driver is postgres, else memory).
  #   experiments: postgres
  # redis:
  #   addr: "localhost:6379"
  # postgres:
  #   dsn: "postgres://user:pass@localhost:5432/db"
  # neo4j:
  #   uri: "neo4j://localhost:7687"
  #   user: "neo4j"
  #   password: "password"

temporal:
  host_port: "localhost:7233"
  namespace: "default"
  task_queue: "gargi_tasks"
  # workflow_task_queue: "gargi_workflows"
  # activity_task_queue: "gargi_activities"
  # tls:
  #   enabled: false
  #   cert_file: "/path/to/cert.pem"
  #   key_file: "/path/to/key.pem"
  #   ca_file: "/path/to/ca.pem"

server:
  http_address: ":8080"
  grpc_address: ":9090"
