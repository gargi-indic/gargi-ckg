name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.4.0

      - name: Setup Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache bin directory
        uses: actions/cache@v4.3.0
        with:
          path: ./bin
          key: ${{ runner.os }}-bin-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-bin-

      - name: Run tools, lint, test, build
        run: make tools lint test build

      - name: Buf Breaking Change Check
        run: make buf-breaking
        if: github.event_name == 'pull_request'

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.4.0

      - name: Setup Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Note: Service containers or testcontainers-go will be used here when integration tests are added
      - name: Run integration tests
        run: make test-integration

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: false
          tags: gargi-server:ci

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: gargi-worker:ci

  ui:
    name: UI Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: make ui-install

      - name: Lint UI
        run: make ui-lint

      - name: Build UI
        run: make ui-build
