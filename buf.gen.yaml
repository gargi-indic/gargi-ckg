version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/gargi-indic/gargi-ckg
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=github.com/gargi-indic/gargi-ckg
  - local: protoc-gen-grpc-gateway
    out: .
    opt:
      - module=github.com/gargi-indic/gargi-ckg
      - generate_unbound_methods=true
  - local: protoc-gen-openapiv2
    out: gen/openapiv2
