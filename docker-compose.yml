
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gargi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gargi_local_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gargi_db}
      TEMPORAL_POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      TEMPORAL_POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_local_secret}
      TEMPORAL_POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-temporal-db.sh:/docker-entrypoint-initdb.d/init-temporal-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gargi} -d ${POSTGRES_DB:-gargi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.0-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  neo4j:
    image: neo4j:5.23.0-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j_local_secret}
    ports:
      - "127.0.0.1:7474:7474" # HTTP
      - "127.0.0.1:7687:7687" # Bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD:-temporal_local_secret}
      - POSTGRES_SEEDS=postgres
      - DBNAME=${TEMPORAL_POSTGRES_DB:-temporal_db}
      - VISIBILITY_DBNAME=${TEMPORAL_POSTGRES_DB:-temporal_db}_visibility
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - SKIP_DB_CREATE=true
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address \"$$(hostname -i):7233\" | grep 'SERVING' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.28.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "127.0.0.1:8233:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: gargi-server:latest
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - GARGI_STORE_DRIVER=redis
      - GARGI_STORE_REDIS_ADDR=redis:6379
      - GARGI_TEMPORAL_HOST_PORT=temporal:7233
      - GARGI_SERVER_HTTP_ADDRESS=:8080
      - GARGI_SERVER_GRPC_ADDRESS=:9090
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: gargi-worker:latest
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - GARGI_STORE_DRIVER=redis
      - GARGI_STORE_REDIS_ADDR=redis:6379
      - GARGI_TEMPORAL_HOST_PORT=temporal:7233

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
