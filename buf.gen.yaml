version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/gargi-indic/gargi-flow
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=github.com/gargi-indic/gargi-flow
  - local: protoc-gen-grpc-gateway
    out: .
    opt:
      - module=github.com/gargi-indic/gargi-flow
      - generate_unbound_methods=true
  - local: protoc-gen-openapiv2
    out: gen/openapiv2
    opt:
      - allow_merge=true
      - merge_file_name=gargi/v1/api
